<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Slamcaster</title>
  <link rel="icon" type="image/png" href="Sc-logo2-1-pfp.png" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
    }
    header {
      background-color: #002f6c;
      padding: 1rem 0 0.5rem;
      text-align: center;
    }
    header img {
      max-width: 90%;
      height: auto;
      display: block;
      margin: 0 auto 0.5rem;
    }
    .tagline {
      color: #fff;
      margin: 0.5rem 0 0;
      font-weight: 500;
    }
    nav {
      background-color: #0074e8;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.75rem 0;
      flex-wrap: wrap;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    .content {
      padding: 2rem;
      text-align: center;
    }
    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .logo-block {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }
    .logo1 {
      max-width: 300px;
      height: auto;
    }
    .logo2 {
      max-width: 300px;
      height: auto;
    }
    .announcement {
      max-width: 300px;
      text-align: left;
      font-size: 1.1rem;
    }
    footer {
      background-color: #002f6c;
      color: white;
      text-align: center;
      padding: 1rem;
    }
    .footer-links {
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }
    .footer-links a {
      color: white;
      margin: 0 0.5rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="Sc-logo1-1.png" alt="Slamcaster Logo" class="logo1" />
    <p class="tagline">Art & Comics from a Voice Behind Bars</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="comics.html">Comics</a>
    <a href="donate.html">Donate</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="content">
    <div class="logo-section">
      <div class="logo-block">
        <div class="announcement">
          <h3>Coming Soon</h3>
          <p>A dozen new comics are dropping soon — stay tuned!</p>
        </div>
        <img src="Sc-logo2-1.png" alt="Slamcaster Secondary Logo" class="logo2" />
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Amadeo. All rights reserved.
    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a> |
      <a href="terms.html">Terms of Service</a>
    </div>
  </footer>

</html>
