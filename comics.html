  <!-- Cookie Consent Banner -->
<style>
  #cookie-consent-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #002f6c;
    color: white;
    padding: 1rem;
    text-align: center;
    font-size: 0.9rem;
    z-index: 1000;
  }

  #cookie-consent-banner a {
    color: #90caf9;
    text-decoration: underline;
    margin: 0 0.25rem;
  }

  #cookie-consent-banner button {
    margin: 0 0.25rem;
    background-color: #0074e8;
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
  }

  #cookie-consent-banner button.reject {
    background-color: #777;
  }
</style>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('cookiesChoice')) {
      const banner = document.createElement('div');
      banner.id = 'cookie-consent-banner';
      banner.innerHTML = `
        This site uses cookies for analytics and advertising. By continuing, you agree to our
        <a href="privacy.html" target="_blank">Privacy Policy</a> and
        <a href="terms.html" target="_blank">Terms of Service</a>.
        <button id="accept-cookies">Accept</button>
        <button id="reject-cookies" class="reject">Reject</button>
      `;
      document.body.appendChild(banner);

      document.getElementById('accept-cookies').onclick = function () {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          analytics_storage: 'granted'
        });
        localStorage.setItem('cookiesChoice', 'accepted');
        banner.remove();
      };

      document.getElementById('reject-cookies').onclick = function () {
        gtag('consent', 'update', {
          ad_storage: 'denied',
          analytics_storage: 'denied'
        });
        localStorage.setItem('cookiesChoice', 'rejected');
        banner.remove();
      };
    }
  });
</script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;

    header {

    .tagline {

    nav {

      flex-wrap: wrap;

    .content {

    }

    .comic-wrapper {
      margin: 2rem auto;

      border: 2px solid #ccc;

        gap: 1rem;
      }

      .comic-embed {
        width: 100%;
        height: auto;
      }
    }

    .dropdown-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  font-size: 1.2rem;
  font-weight: bold;
  background-color: transparent;
  border: none;
  cursor: pointer;
  padding: 0.75rem 0;
  text-align: left;
}

.arrow {
  font-size: 1.2rem;
  transition: transform 0.3s ease;
}

.comic-content {
  display: none;
  margin-top: 1rem;
}

.comic-wrapper.active .comic-content {
  display: block;
}

.comic-wrapper.active .arrow {
  transform: rotate(180deg);
}

  <script>
  document.querySelectorAll('.dropdown-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrapper = btn.parentElement;
      const content = wrapper.querySelector('.comic-content');
      const img = content.querySelector('img');

      wrapper.classList.toggle('active');

      // Lazy-load the image when expanding
      if (img && !img.src) {
        img.src = img.dataset.src;
      }
    });
  });
</script>
